aid: definedcrowd
name: Defined.ai (DefinedCrowd)
description: >-
  Defined.ai (formerly DefinedCrowd) is an AI training data platform and
  marketplace founded in 2015 by Daniela Braga, headquartered in Seattle with
  offices in Lisbon, Porto, and Tokyo. It provides ready-to-use datasets across
  speech, text, image, video, and multimodal, plus custom data collection,
  annotation, machine translation, conversational AI, LLM fine-tuning, and data
  and model evaluation services sourced from a global community of 1.6M+ vetted
  contributors across 150+ markets and 500+ languages, dialects, and locales.
  The Defined.ai Public API (v2.0) lets enterprise customers manage projects
  programmatically — create Mean Opinion Score and Pronunciation Validation
  projects, upload input units, configure supported languages, track project
  status and errors, manage jobs, retrieve deliverables, and subscribe to
  notifications. Data provenance and compliance are backed by ISO 27001, ISO
  27701, ISO 42001, GDPR, and HIPAA.
