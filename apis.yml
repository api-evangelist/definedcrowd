- aid: definedcrowd:definedcrowd-supported-languages-api
  name: Defined.ai (DefinedCrowd) Supported Languages API
  description: >-
    Several of the Workflow Templates offer the ability to set a language / country code. These configurations
    instruct Defined.ai to use our human intelligence Contributors that speak and / or reside in the specified
    language / country. The REST API provides a method called “Get Supported Languages” that returns the
    set of languages, language features and associated language codes that are used by our APIs and supported
    by the Defined.ai platform.
  humanURL: https://developers.definedcrowd.com/
